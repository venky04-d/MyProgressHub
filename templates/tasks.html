<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Tasks</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Home Button -->
    <a href="/" class="home-button">
        Home
    </a>

    <h1>My Tasks</h1>

    <p class="page-description">
        Here are the tasks I am working on.
    </p>


    <!-- Task Filters -->
    <div class="task-filters">

        <button type="button"
                onclick="showTasks('all')">
            All
        </button>

        <button type="button"
                onclick="showTasks('pending')">
            Pending
        </button>

        <button type="button"
                onclick="showTasks('completed')">
            Completed
        </button>

    </div>


    <!-- Task List -->
    <div class="item-list">

        {% for task in tasks %}

        <div class="item-card"
             data-completed="{{ task[2] }}">

            <!-- Checkbox -->
            <form action="/complete-task/{{ task[0] }}"
                  method="POST"
                  class="task-check"
                  onsubmit="completeTask(event, this)">

                <input type="checkbox"
                       onchange="this.form.requestSubmit()"
                       {% if task[2] == 1 %}checked{% endif %}>

            </form>


            <!-- Task Name -->
            <strong class="{% if task[2] == 1 %}completed-task{% endif %}">
                {{ task[1] }}
            </strong>


            <!-- Actions -->
            <div class="actions">

                <a href="/edit-task/{{ task[0] }}">
                    <button type="button">
                        Edit
                    </button>
                </a>

                <form action="/delete-task/{{ task[0] }}"
                      method="POST">

                    <button type="submit">
                        Delete
                    </button>

                </form>

            </div>

        </div>

        {% endfor %}

    </div>


    <!-- JavaScript -->
    <script>

        /* Complete / Uncomplete Task */

        async function completeTask(event, form) {

            event.preventDefault();

            const checkbox = form.querySelector("input");
            const card = form.closest(".item-card");
            const task = card.querySelector("strong");

            try {

                const response = await fetch(form.action, {
                    method: "POST"
                });

                if (response.ok) {

                    if (checkbox.checked) {

                        task.classList.add("completed-task");
                        card.dataset.completed = "1";

                    } else {

                        task.classList.remove("completed-task");
                        card.dataset.completed = "0";

                    }

                } else {

                    // Return checkbox to previous state
                    checkbox.checked = !checkbox.checked;

                }

            } catch (error) {

                console.log("Error updating task:", error);

                // Return checkbox to previous state
                checkbox.checked = !checkbox.checked;
            }
        }


        /* Task Filters */

        function showTasks(type) {

            const tasks =
                document.querySelectorAll(".item-card");

            tasks.forEach(task => {

                const completed =
                    task.dataset.completed === "1";

                if (type === "all") {

                    task.style.display = "flex";

                }

                else if (type === "pending") {

                    task.style.display =
                        completed ? "none" : "flex";

                }

                else if (type === "completed") {

                    task.style.display =
                        completed ? "flex" : "none";

                }

            });
        }

    </script>

</body>

</html>
