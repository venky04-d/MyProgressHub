<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Note</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Home Button -->
    <a href="/" class="home-button">
        Home
    </a>

    <h1>Edit Note</h1>

    <p class="page-description">
        Edit your note below.
    </p>


    <!-- Edit Note Form -->
    <div class="form-card">

        <form action="/edit-note/{{ note[0] }}"
              method="POST">

            <textarea name="note"
                      id="note-textarea"
                      rows="12"
                      required>{{ note[1] }}</textarea>

            <br>

            <button type="submit">
                Save Changes
            </button>

        </form>

    </div>


    <!-- Back Button -->
    <a href="/notes">
        <button type="button">
            Back to Notes
        </button>
    </a>


    <!-- Tab Indentation -->
    <script>

        const textarea =
            document.getElementById("note-textarea");

        textarea.addEventListener("keydown", function(event) {

            if (event.key === "Tab") {

                // Prevent Tab from moving to another element
                event.preventDefault();

                const start = this.selectionStart;
                const end = this.selectionEnd;

                // Small indentation = 2 spaces
                const indent = "  ";

                this.value =
                    this.value.substring(0, start) +
                    indent +
                    this.value.substring(end);

                // Move cursor after indentation
                this.selectionStart =
                    this.selectionEnd =
                    start + indent.length;
            }

        });

    </script>

</body>

</html>
